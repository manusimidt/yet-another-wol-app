name: Public Release Workflow

on:
  workflow_dispatch:
    inputs:
      hash:
        description: "Commit hash to pull image for"
        required: true
      version:
        description: "Version tag to publish (e.g. v1.4.2)"
        required: true
      confirm:
        description: "Type 'banana' to confirm public release"
        required: true

jobs:
  release:
    name: Create Public Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'banana' }}
    
    steps:
      - name: Pull amd64 image from GHCR
        run: |
          docker pull manusimidt/yawapp:${{ github.event.inputs.hash }}-amd64

      - name: Pull arm64 image from GHCR
        run: |
          docker pull manusimidt/yawapp:${{ github.event.inputs.hash }}-arm64

      - name: Retag images for Docker Hub (version + latest)
        run: |
          for arch in amd64 arm64; do
            docker tag manusimidt/yawapp:${{ github.event.inputs.hash }}-$arch manusimidt/yawapp:${{ github.event.inputs.version }}-$arch
            docker tag manusimidt/yawapp:${{ github.event.inputs.hash }}-$arch manusimidt/yawapp:latest-$arch
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push arch images to Docker Hub
        run: |
          for arch in amd64 arm64; do
            docker push manusimidt/yawapp:${{ github.event.inputs.version }}-$arch
            docker push manusimidt/yawapp:latest-$arch
          done