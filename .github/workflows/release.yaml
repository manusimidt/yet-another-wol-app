name: Public Release Workflow

on:
  workflow_dispatch:
    inputs:
      hash:
        description: "Commit hash to pull image for"
        required: true
      version:
        description: "Version tag to publish (e.g. v1.4.2)"
        required: true
      confirm:
        description: "Type 'banana' to confirm public release"
        required: true

jobs:
  release:
    name: Create Public Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'banana' }}
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Retag and push multi-arch manifest to Docker Hub
        run: |
          docker buildx imagetools create \
            --tag manusimidt/yawapp:${{ github.event.inputs.version }} \
            --tag manusimidt/yawapp:latest \
            manusimidt/yawapp:${{ github.event.inputs.hash }}