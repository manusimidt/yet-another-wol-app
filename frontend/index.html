<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <title>YAPP WoL</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #0d0d0d;
        color: #ffffff;
        min-height: 100vh;
        padding: 24px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 48px;
        padding: 24px 0;
        border-bottom: 1px solid #1a1a1a;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 500;
        color: #ffffff;
        letter-spacing: -0.02em;
      }

      h1 span {
        color: #22c55e;
      }

      .server-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        margin-bottom: 30px;
      }

      .server-card {
        background: #141414;
        border: 1px solid #262626;
        border-radius: 8px;
        padding: 20px;
        position: relative;
        transition: border-color 0.15s ease;
      }

      .server-card:hover {
        border-color: #404040;
      }

      .ping-indicator {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #262626;
        border: 1px solid #404040;
      }

      .ping-indicator.ok {
        background: #22c55e;
        border-color: #166534;
      }

      .server-name {
        font-size: 1rem;
        color: #ffffff;
        margin-bottom: 4px;
        font-weight: 500;
      }

      .server-ip {
        color: #666666;
        margin-bottom: 16px;
        font-family: "SF Mono", "Fira Code", "Consolas", monospace;
        font-size: 0.8rem;
      }

      .wake-button {
        width: 100%;
        padding: 10px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        color: #000000;
        background: #22c55e;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .wake-button:hover {
        background: #16a34a;
      }

      .wake-button:active {
        background: #15803d;
      }

      .wake-button:disabled {
        background: #262626;
        color: #666666;
        cursor: not-allowed;
      }

      /* PIN Overlay */
      .pin-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .pin-overlay.active {
        display: flex;
      }

      .pin-dialog {
        background: #141414;
        border: 1px solid #262626;
        border-radius: 12px;
        padding: 32px;
        max-width: 360px;
        width: 90%;
      }

      .pin-dialog h2 {
        color: #ffffff;
        margin-bottom: 24px;
        text-align: center;
        font-size: 1.25rem;
        font-weight: 500;
      }

      .pin-input {
        width: 100%;
        padding: 12px 16px;
        font-size: 1rem;
        background: #0d0d0d;
        border: 1px solid #262626;
        border-radius: 6px;
        color: #ffffff;
        text-align: center;
        letter-spacing: 4px;
        margin-bottom: 20px;
        transition: border-color 0.15s ease;
      }

      .pin-input:focus {
        outline: none;
        border-color: #22c55e;
      }

      .pin-buttons {
        display: flex;
        gap: 12px;
      }

      .pin-button {
        flex: 1;
        padding: 10px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .pin-button.confirm {
        background: #22c55e;
        color: #000000;
      }

      .pin-button.confirm:hover {
        background: #16a34a;
      }

      .pin-button.cancel {
        background: #262626;
        color: #ffffff;
      }

      .pin-button.cancel:hover {
        background: #333333;
      }

      /* Status message */
      .status-message {
        position: fixed;
        top: 24px;
        right: 24px;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        z-index: 2000;
        opacity: 0;
        transform: translateY(-10px);
        transition: all 0.2s ease;
      }

      .status-message.show {
        opacity: 1;
        transform: translateY(0);
      }

      .status-message.success {
        background: #052e16;
        border: 1px solid #166534;
        color: #22c55e;
      }

      .status-message.error {
        background: #2c0a0a;
        border: 1px solid #7f1d1d;
        color: #ef4444;
      }

      /* Loading state */
      .loading {
        text-align: center;
        padding: 48px;
        color: #666666;
        font-size: 0.875rem;
      }

      @media (max-width: 768px) {
        body {
          padding: 16px;
        }

        header {
          margin-bottom: 32px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .server-grid {
          grid-template-columns: 1fr;
        }

        .pin-dialog {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1><span>Wake</span>OnLan</h1>
      </header>

      <div id="serverList" class="server-grid">
        <div class="loading">Loading servers...</div>
      </div>
    </div>

    <!-- PIN Overlay -->
    <div id="pinOverlay" class="pin-overlay">
      <div class="pin-dialog">
        <h2>🔐 Enter PIN</h2>
        <input
          type="password"
          id="pinInput"
          class="pin-input"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="Enter PIN"
          maxlength="10"
        />
        <div class="pin-buttons">
          <button class="pin-button cancel" onclick="cancelPin()">Cancel</button>
          <button class="pin-button confirm" onclick="confirmPin()">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="status-message"></div>

    <script>
      let servers = [];
      let pinRequired = false;
      let pendingWake = null;

      // ping status per serverName: boolean (true = ping ok)
      const pingStatus = {};

      // Load servers on page load
      async function loadServers() {
        try {
          const response = await fetch("/api/servers");
          const data = await response.json();

          servers = data.servers;
          pinRequired = data.pinRequired;

          renderServers();
          startPingChecks();
        } catch (error) {
          console.error("Error loading servers:", error);
          showStatus("Failed to load servers", "error");
        }
      }

      // Render server cards
      function renderServers() {
        const serverList = document.getElementById("serverList");

        if (servers.length === 0) {
          serverList.innerHTML = '<div class="loading">No servers configured</div>';
          return;
        }

        serverList.innerHTML = "";
        servers.forEach((server) => {
          const card = document.createElement("div");
          card.className = "server-card";

          const indicator = document.createElement("div");
          indicator.className = pingStatus[server.name] ? "ping-indicator ok" : "ping-indicator";
          indicator.setAttribute("aria-label", "Ping status");
          indicator.dataset.serverName = server.name;

          const nameEl = document.createElement("div");
          nameEl.className = "server-name";
          nameEl.textContent = server.name;

          const ipEl = document.createElement("div");
          ipEl.className = "server-ip";
          ipEl.textContent = server.ip;

          const button = document.createElement("button");
          button.className = "wake-button";
          button.textContent = "Wake Up";
          button.onclick = () => wakeServer(server.name);
          button.dataset.serverName = server.name;
          button.disabled = pingStatus[server.name];

          card.appendChild(indicator);
          card.appendChild(nameEl);
          card.appendChild(ipEl);
          card.appendChild(button);
          serverList.appendChild(card);
        });
      }

      function cssEscape(value) {
        if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(value);
        return String(value).replace(/[^a-zA-Z0-9_\-]/g, "\\$&");
      }

      function updatePingIndicator(serverName) {
        const selector = `[data-server-name="${cssEscape(serverName)}"]`;
        const indicator = document.querySelector(selector);
        if (!indicator) return;
        indicator.className = pingStatus[serverName] ? "ping-indicator ok" : "ping-indicator";

        // Update button disabled state
        const button = document.querySelector(`button[data-server-name="${cssEscape(serverName)}"]`);
        if (button) {
          button.disabled = pingStatus[serverName];
        }
      }

      async function pingServer(serverName) {
        try {
          const response = await fetch(`/api/ping/${encodeURIComponent(serverName)}`, {
            method: "PUT",
          });

          const data = await response.json().catch(() => null);
          pingStatus[serverName] = Boolean(response.ok && data && data.alive === true);
          updatePingIndicator(serverName);
        } catch (error) {
          pingStatus[serverName] = false;
          updatePingIndicator(serverName);
        }
      }

      function startPingChecks() {
        servers.forEach((server) => {
          pingStatus[server.name] = false;
          updatePingIndicator(server.name);
          pingServer(server.name);
        });

        // Ping all servers every 5 seconds
        setInterval(() => {
          servers.forEach((server) => {
            pingServer(server.name);
          });
        }, 5000);
      }

      // Wake server
      function wakeServer(serverName) {
        if (pinRequired) {
          pendingWake = serverName;
          showPinOverlay();
        } else {
          sendWakeCommand(serverName, null);
        }
      }

      // Send wake command
      async function sendWakeCommand(serverName, pin) {
        try {
          const response = await fetch(`/api/wake/${encodeURIComponent(serverName)}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ pin }),
          });

          const data = await response.json();

          if (response.ok) {
            showStatus(`✓ ${data.message}`, "success");
          } else {
            showStatus(`✗ ${data.error}`, "error");
          }
        } catch (error) {
          console.error("Error waking server:", error);
          showStatus("Failed to send wake command", "error");
        }
      }

      // PIN overlay functions
      function showPinOverlay() {
        document.getElementById("pinOverlay").classList.add("active");
        document.getElementById("pinInput").value = "";
        document.getElementById("pinInput").focus();
      }

      function hidePinOverlay() {
        document.getElementById("pinOverlay").classList.remove("active");
        pendingWake = null;
      }

      function cancelPin() {
        hidePinOverlay();
      }

      function confirmPin() {
        const pin = document.getElementById("pinInput").value;
        if (!pin) {
          showStatus("Please enter a PIN", "error");
          return;
        }

        sendWakeCommand(pendingWake, pin);
        hidePinOverlay();
      }

      // Show status message
      function showStatus(message, type) {
        const statusEl = document.getElementById("statusMessage");
        statusEl.textContent = message;
        statusEl.className = `status-message ${type}`;

        // Trigger animation
        setTimeout(() => statusEl.classList.add("show"), 10);

        // Hide after 3 seconds
        setTimeout(() => {
          statusEl.classList.remove("show");
        }, 3000);
      }

      // Allow Enter key to confirm PIN
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("pinInput").addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            confirmPin();
          }
        });

        loadServers();
      });
    </script>
  </body>
</html>
